# =============================================================================
# MeetScribe Configuration
# =============================================================================
# Copy this file to data/config.yaml (or to MEETSCRIBE_DATA_DIR directory)
# and adjust for your environment.
#
# Data directory path is set via .env:
#   MEETSCRIBE_DATA_DIR=./data
# =============================================================================

# -----------------------------------------------------------------------------
# Processing servers (speaches API)
# -----------------------------------------------------------------------------
# List of remote GPU servers for diarization, embeddings and transcription.
# Each server has a unique name referenced in sections below.
# Multiple servers can be used for parallel transcription.
servers:
  - url: http://192.168.1.100:8000
    name: "GPU-1"
  # - url: http://192.168.1.101:8000
  #   name: "GPU-2"

# -----------------------------------------------------------------------------
# Speaker Diarization
# -----------------------------------------------------------------------------
# Server-side speaker diarization via pyannote segmentation + VBx clustering.
# Detects speech segments and assigns speaker labels in one call.
diarization:
  # Server name from the servers section.
  server: "GPU-1"

  # Diarization model (HuggingFace ID).
  model: "fedirz/segmentation_community_1"

  # HTTP request timeout in seconds.
  # Diarization processes the full file at once — increase for long recordings.
  timeout: 600

# -----------------------------------------------------------------------------
# Speaker Embeddings
# -----------------------------------------------------------------------------
# Neural model converts audio into a fixed-dimension vector.
# Embeddings are used to compare voices via cosine similarity.
embeddings:
  # Server name from the servers section.
  server: "GPU-1"

  # Speaker embedding model (HuggingFace ID).
  model: "Wespeaker/wespeaker-voxceleb-resnet34-LM"

  # HTTP request timeout in seconds per segment.
  timeout: 60

  # Cosine similarity threshold for known speaker identification.
  # Higher = stricter matching (fewer false positives).
  # Range: 0.0 — 1.0. Recommended: 0.5 — 0.7.
  threshold: 0.6

  # Minimum segment duration (ms) for embedding extraction.
  # Shorter segments produce unreliable embeddings.
  min_duration_ms: 1500

  # "Confident gap": if the best candidate is below threshold,
  # but the gap to the second candidate >= confident_gap — accept the match.
  # Helps identify speakers in noisy recordings.
  confident_gap: 0.2

  # Absolute minimum similarity even with a confident gap.
  # Below this value, the match is never accepted.
  min_threshold: 0.45

  # --- Sample extraction (for speaker enrollment) ---

  # Minimum segment duration (ms) to use as a sample.
  sample_min_duration_ms: 4000

  # Maximum segment duration (ms) before slicing into chunks.
  # Segments longer than this are split into ~sample_ideal_duration_ms pieces.
  sample_max_duration_ms: 12000

  # Target chunk size (ms) when slicing long segments.
  sample_ideal_duration_ms: 7000

  # Maximum samples to extract per speaker.
  max_samples_per_speaker: 8

# -----------------------------------------------------------------------------
# Transcription
# -----------------------------------------------------------------------------
# Speech-to-text via OpenAI-compatible API (speaches).
transcription:
  # Server list for parallel transcription.
  # Chunks are sent concurrently and distributed round-robin across servers.
  servers: ["GPU-1"]

  # Max concurrent in-flight transcription requests (ceiling on worker threads).
  # Speaches processes requests in a threadpool with no cross-request batching,
  # so concurrency is what keeps every server busy. 0 = auto (servers * 3).
  max_inflight: 0

  # Transcription model (HuggingFace ID).
  # The server will try to auto-detect the model via /v1/models,
  # this value is used as a fallback.
  # Options: Systran/faster-whisper-{tiny,base,small,medium,large-v3}
  model: "Systran/faster-whisper-medium"

  # Transcription language (ISO 639-1). Overridden by --language in CLI.
  language: ru

  # HTTP request timeout in seconds per segment.
  # For whole-file transcription, max(timeout, 600) is used automatically.
  timeout: 120

  # (round-robin over servers; concurrency capped by max_inflight above)

  # Maximum gap (ms) between segments to merge into one chunk.
  # Small gaps between phrases of the same speaker are merged.
  max_gap_ms: 500

  # Maximum merged chunk duration (ms).
  # Limits the audio size sent for transcription at once.
  # 30000 ms = 30 seconds.
  max_chunk_ms: 30000

  # How diarized speech is sent to the server:
  #   chunks — one request per chunk, audio sliced on the client.
  #   clips  — one request per track: the track is uploaded once together with
  #            the list of clips. Needs a server with
  #            /v1/audio/transcriptions/clips; on older servers falls back to
  #            chunks. Uses only the first server of the list.
  # Named tracks are always sent as a whole file.
  segment_mode: chunks

  # Short segments (under min_chunk_ms) are attached to the neighbouring chunk
  # of the same speaker when the pause between them is within max_gap_ms.
  # Whisper is unreliable on sub-second clips. 0 disables.
  min_chunk_ms: 1000

  # Extra audio (ms) sent on each side of a chunk so that the first and the
  # last word are not cut off. Never reaches into a neighbouring chunk.
  chunk_padding_ms: 200

  # A phrase repeated across the joint of two neighbouring chunks is dropped
  # when the word similarity is at least dedup_similarity (0.0 — 1.0) and both
  # phrases have at least dedup_min_words words. dedup_similarity: 0 disables.
  dedup_similarity: 0.9
  dedup_min_words: 4

  # --- Hallucination filtering ---
  # A segment is dropped when ANY rule matches. Dropped segments are logged
  # with the reason and, in the web UI, kept for review and restore.
  #
  # 1. blocklist: the text contains one of hallucination_phrases and is at most
  #    hallucination_phrase_max_extra_words words longer than the phrase.
  #    Matching ignores case and punctuation.
  hallucination_phrases:
    - "Редактор субтитров"
    - "Корректор"
    - "Субтитры подготовлены"
    - "Субтитры сделал"
    - "Продолжение следует"
    - "С вами был Игорь Негода"
    - "Спасибо за просмотр"
    - "Спасибо за внимание"
    - "Подписывайтесь"
    - "Увидимся в следующем видео"
    - "До новых встреч"
    - "Добро пожаловать"
    - "Фондю любит тебя"
    - "КОНЕЦ"
    - "СПОКОЙНАЯ МУЗЫКА"
    - "СМЕХ"
  hallucination_phrase_max_extra_words: 8

  # 2. logprob: avg_logprob <= threshold, whatever the segment length.
  hallucination_logprob_threshold: -1.0

  # 3. legacy: no_speech_prob >= threshold AND avg_logprob <= threshold,
  #    only for segments of up to legacy_filter_max_words words.
  #    Set no_speech_prob_threshold to 1.0 to disable this rule.
  no_speech_prob_threshold: 0.5
  avg_logprob_threshold: -0.25
  legacy_filter_max_words: 5

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Log level for file handler. Console always logs ERROR and above.
# Options: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# -----------------------------------------------------------------------------
# Web UI
# -----------------------------------------------------------------------------
# Built-in web interface settings (FastAPI + Uvicorn).
web:
  # Bind address. 127.0.0.1 = localhost only, 0.0.0.0 = all interfaces.
  host: 127.0.0.1

  # Web server port.
  port: 8080

  # Auth session lifetime in days.
  # After expiration the user needs to log in again.
  session_ttl_days: 7

  # Set to true when running behind HTTPS reverse proxy.
  # Adds Secure flag to cookies (browser won't send them over HTTP).
  secure_cookies: false
