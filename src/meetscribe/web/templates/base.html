<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetScribe</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" integrity="sha384-Rpe/8orFUm5Q1GplYBHxbuA8Az8O8C5sAoOsdbRWkqPjKFaxPgGZipj4zeHL7lxX" crossorigin="anonymous"></script>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" integrity="sha384-BSxuMLxX+FCbTdYec3TbXlnMGEEM2QXTFdtDaveen71o+jswm2J36+xFqp8k4VHM" crossorigin="anonymous"></script>
    <!-- Marked.js (Markdown renderer) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    {% include "partials/tailwind_config.html" %}
    <style>
        [x-cloak] { display: none !important; }
        .step-active { @apply bg-primary-600 text-white; }
        .step-complete { @apply bg-green-500 text-white; }
        .step-pending { @apply bg-gray-200 text-gray-600; }
        .drag-ghost { opacity: 0.5; }
        .drag-chosen { opacity: 0.8; }
        /* Material Design ripple effect */
        .ripple { position: relative; overflow: hidden; }
        .ripple::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }
        .ripple:active::after { width: 200%; height: 200%; }
        /* Markdown prose styles */
        .prose h1 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0.5rem; }
        .prose h2 { font-size: 1.25rem; font-weight: 700; margin: 1rem 0 0.5rem; }
        .prose h3 { font-size: 1.1rem; font-weight: 600; margin: 0.75rem 0 0.25rem; }
        .prose p { margin: 0.25rem 0; }
        .prose ul, .prose ol { padding-left: 1.5rem; margin: 0.25rem 0; }
        .prose ul { list-style-type: disc; }
        .prose ol { list-style-type: decimal; }
        .prose strong { font-weight: 700; }
        .prose em { font-style: italic; }
        .prose hr { border-top: 1px solid #d1d5db; margin: 0.75rem 0; }
        .prose code { background: #e5e7eb; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.875em; }
        .prose blockquote { border-left: 3px solid #d1d5db; padding-left: 0.75rem; color: #6b7280; margin: 0.5rem 0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="shell">
    <div class="max-w-6xl mx-auto px-3 py-4 sm:px-4 sm:py-8">
        <!-- Header -->
        <header class="mb-6 sm:mb-8">
            <div class="flex items-center justify-between">
                <div class="min-w-0">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">MeetScribe</h1>
                    <p class="text-gray-600 text-sm sm:text-base mt-1">Meeting transcription with speaker diarization</p>
                </div>
                <!-- User actions -->
                <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                    <button
                        @click="navigate('/sessions')"
                        class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors"
                        :class="activePage === 'sessions' && 'bg-gray-100 text-gray-800'"
                        title="Session archive"
                    >
                        <svg class="inline-block w-5 h-5 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                        <span class="hidden sm:inline">Sessions</span>
                    </button>
                    {% if is_admin %}
                    <button
                        @click="navigate('/admin')"
                        class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors"
                        :class="activePage === 'admin' && 'bg-gray-100 text-gray-800'"
                        title="Admin panel"
                    >
                        <svg class="inline-block w-5 h-5 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <span class="hidden sm:inline">Admin</span>
                    </button>
                    {% endif %}
                    <button
                        @click="navigate('/speakers')"
                        class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors"
                        :class="activePage === 'speakers' && 'bg-gray-100 text-gray-800'"
                        title="Enrolled speakers"
                    >
                        <svg class="inline-block w-5 h-5 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <span class="hidden sm:inline">Speakers</span>
                    </button>
                    <button
                        @click="if(confirm('Start a new session? Current progress will be lost.')) newWorkflowSession()"
                        class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors"
                        title="Start new session"
                    >
                        <svg class="inline-block w-5 h-5 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                        <span class="hidden sm:inline">New</span>
                    </button>
                    <form method="POST" action="/auth/logout" class="inline">
                        <input type="hidden" name="{{ csrf_field_name }}" value="{{ csrf_token(request) }}">
                        <button type="submit"
                            class="px-3 py-2 text-sm text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                            title="Sign out"
                        >
                            <svg class="inline-block w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </header>

        {% block content %}{% endblock %}

        <!-- Footer -->
        <footer class="mt-4 sm:mt-8 text-center text-gray-500 text-xs sm:text-sm">
            <p>MeetScribe - Meeting transcription with speaker diarization</p>
        </footer>
    </div>

    <script src="/static/js/shell.js"></script>
    <script src="/static/js/workflow-page.js"></script>
    <script src="/static/js/sessions-page.js"></script>
    <script src="/static/js/speakers-page.js"></script>
    <script src="/static/js/admin-page.js"></script>
</body>
</html>
