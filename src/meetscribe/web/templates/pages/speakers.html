<!-- Enrolled speakers dashboard -->
<div class="space-y-6">
    <h2 class="text-2xl font-bold text-gray-800">Speakers</h2>

    <!-- Error states -->
    <div x-show="loadError" x-cloak class="p-4 bg-red-50 text-red-700 rounded-xl text-sm flex items-center justify-between">
        <span>Failed to load speakers.</span>
        <button @click="load()" class="font-medium underline hover:no-underline">Retry</button>
    </div>
    <div x-show="actionError" x-cloak class="p-4 bg-red-50 text-red-700 rounded-xl text-sm flex items-center justify-between">
        <span x-text="actionError"></span>
        <button @click="actionError = ''" class="font-medium underline hover:no-underline">Dismiss</button>
    </div>

    <!-- Speaker list -->
    <div class="space-y-3">
        <template x-for="s in speakers" :key="s.name">
            <div class="p-4 bg-gray-50 rounded-xl shadow-sm">
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                        <template x-if="renameTarget !== s.name">
                            <p class="font-medium text-gray-800 truncate" x-text="s.name"></p>
                        </template>
                        <template x-if="renameTarget === s.name">
                            <form @submit.prevent="submitRename()" class="flex items-center gap-2">
                                <input
                                    x-model="renameValue"
                                    x-init="$el.focus()"
                                    aria-label="New speaker name"
                                    @keydown.escape="renameTarget = null"
                                    class="px-2 py-1 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                                >
                                <button type="submit" class="text-sm text-primary-600 font-medium hover:underline">Save</button>
                                <button type="button" @click="renameTarget = null" class="text-sm text-gray-500 hover:underline">Cancel</button>
                            </form>
                        </template>
                        <!-- Voiceprint quality: sample count + total duration -->
                        <span
                            class="px-2 py-0.5 rounded-full text-xs font-medium shrink-0"
                            :class="qualityBadge(s)"
                            :title="'Voiceprint quality: ' + quality(s)"
                            x-text="qualityStats(s)"
                        ></span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button
                            @click="toggleSamples(s.name)"
                            class="px-3 py-1.5 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors"
                            x-text="openSpeaker === s.name ? 'Hide samples' : 'Samples'"
                        ></button>
                        <button
                            @click="startRename(s.name)"
                            title="Rename speaker"
                            class="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-full transition-colors"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                        </button>
                        <button
                            @click="removeSpeaker(s.name)"
                            title="Delete speaker"
                            class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <p class="mt-1 text-xs text-gray-400 truncate">
                    <span x-text="s.model"></span>
                    <span> · enrolled </span><span x-text="formatDate(s.created_at)"></span>
                </p>

                <!-- Samples -->
                <div x-show="openSpeaker === s.name" x-cloak class="mt-3 space-y-2">
                    <p x-show="samplesLoading" class="text-sm text-gray-500">Loading samples...</p>
                    <p x-show="!samplesLoading && samples.length === 0" class="text-sm text-gray-500">No samples on disk for this speaker.</p>
                    <!-- Shared speed and volume for all sample players -->
                    <div x-show="samples.length > 0" class="flex items-center gap-1">
                        <span class="text-xs text-gray-500 mr-1">Speed</span>
                        <template x-for="rate in [1, 1.5, 2]" :key="rate">
                            <button
                                @click="setPlaybackSpeed(rate)"
                                :class="playbackRate === rate ? 'bg-primary-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                class="px-2 py-1 rounded text-xs font-medium transition-colors"
                                x-text="rate + 'x'"
                            ></button>
                        </template>
                        <div class="flex items-center gap-1.5 ml-2 border-l border-gray-200 pl-2">
                            <button @click="toggleMute()" class="p-1 text-gray-500 hover:text-gray-800 rounded transition-colors" :title="muted ? 'Unmute' : 'Mute'">
                                <svg x-show="!muted" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M12 6L8 10H5a1 1 0 00-1 1v2a1 1 0 001 1h3l4 4V6z"></path>
                                </svg>
                                <svg x-show="muted" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l4-4m0 4l-4-4"></path>
                                </svg>
                            </button>
                            <input
                                type="range" min="0" max="1" step="0.05"
                                x-model.number="volume"
                                @input="applyVolume()"
                                aria-label="Volume for all samples"
                                class="w-24 h-1.5 accent-primary-600 cursor-pointer"
                            >
                        </div>
                    </div>
                    <template x-for="sm in samples" :key="sm.filename">
                        <div class="flex items-center gap-3 p-2 bg-white rounded-lg border border-gray-200">
                            <audio controls controlslist="nodownload noplaybackrate" preload="none" :src="sampleUrl(sm.filename)" @play="pauseOthers($event.target)" @volumechange="syncVolume($event.target)" class="sample-audio h-8 grow min-w-0"></audio>
                            <span class="text-xs text-gray-500 shrink-0" x-text="formatDuration(sm.duration_ms)"></span>
                            <span class="text-xs text-gray-400 truncate hidden sm:inline" x-text="sm.filename"></span>
                            <button
                                @click="removeSample(sm.filename)"
                                title="Delete sample"
                                class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors shrink-0"
                            >
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty state -->
    <div x-show="!speakersLoading && !loadError && speakers.length === 0" x-cloak class="text-center py-16">
        <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <p class="mt-4 text-lg font-medium text-gray-600">No enrolled speakers</p>
        <p class="mt-1 text-sm text-gray-500">Enroll speakers from the workflow to see them here</p>
    </div>
</div>
